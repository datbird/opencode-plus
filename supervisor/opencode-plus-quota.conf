[program:opencode-plus-quota]
command=/bin/bash -lc "if [[ \"${OPENCODE_PLUS_ENHANCEMENT_MODE:-true}\" != \"true\" ]]; then echo 'opencode-plus-quota disabled; set OPENCODE_PLUS_ENHANCEMENT_MODE=true to enable'; exit 0; fi; cd /opt/opencode-plus-quota; exec node server.mjs"
directory=/opt/opencode-plus-quota
autostart=true
autorestart=true
startsecs=2
startretries=999
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/config/logs/opencode-plus-quota.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
stderr_logfile=/config/logs/opencode-plus-quota.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=5
environment=HOME="/root",USER="root",LOGNAME="root",PATH="/root/.opencode/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",OPENCODE_PLUS_CONFIG_FILE="/config/persist/opencode-plus-config.json",OPENCODE_PLUS_SECRETS_DIR="/config/persist/opencode-plus-secrets"
