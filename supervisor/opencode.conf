[program:sshd]
command=/bin/bash -lc "if [[ \"${OPENCODE_PLUS_ENHANCEMENT_MODE:-true}\" != \"true\" ]]; then echo 'sshd disabled; set OPENCODE_PLUS_ENHANCEMENT_MODE=true to enable'; exit 0; fi; exec /usr/sbin/sshd -D -e"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/config/logs/sshd.log
stderr_logfile=/config/logs/sshd.err.log

[program:opencode-server]
command=/usr/local/bin/opencode-server-wrapper
directory=/root
autostart=true
autorestart=true
startsecs=5
startretries=999
stopasgroup=true
killasgroup=true
stdout_logfile=/config/logs/opencode-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/config/logs/opencode-server.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=HOME="/root",USER="root",LOGNAME="root",PATH="/root/.opencode/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
