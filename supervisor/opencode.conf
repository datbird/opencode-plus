[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/config/logs/sshd.log
stderr_logfile=/config/logs/sshd.err.log

[program:opencode-server]
command=/usr/local/bin/opencode-server-wrapper
directory=/data/aiplayground
autostart=true
autorestart=true
startsecs=5
startretries=999
stopasgroup=true
killasgroup=true
stdout_logfile=/config/logs/opencode-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/config/logs/opencode-server.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=HOME="/root",USER="root",LOGNAME="root",PATH="/root/.opencode/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
