[program:opencode-cf-auth-proxy]
command=/bin/bash -lc "if [[ \"${OPENCODE_PLUS_ENHANCEMENT_MODE:-true}\" != \"true\" ]]; then echo 'opencode-cf-auth-proxy disabled; set OPENCODE_PLUS_ENHANCEMENT_MODE=true to enable'; exit 0; fi; if [[ \"${OPENCODE_CF_AUTH_ENABLED:-false}\" != \"true\" ]]; then echo 'opencode-cf-auth-proxy disabled; set OPENCODE_CF_AUTH_ENABLED=true to enable'; exit 0; fi; set -a; source /config/persist/opencode-cf-auth-proxy.env; exec /usr/local/bin/opencode-cf-auth-proxy"
directory=/root
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=999
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/config/logs/opencode-cf-auth-proxy.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
stderr_logfile=/config/logs/opencode-cf-auth-proxy.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=5
environment=HOME="/root",USER="root",LOGNAME="root",PATH="/root/.opencode/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
