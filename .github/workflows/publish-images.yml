name: Publish Images

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - bridge/**
      - scripts/**
      - supervisor/**
      - .github/workflows/publish-images.yml
  workflow_dispatch:
    inputs:
      variant:
        description: Docker target to build
        required: true
        default: dev
        type: choice
        options:
          - base
          - dev
          - full
      publish_latest:
        description: Also tag the selected image as latest
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/opencode-plus

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve publish inputs
        id: publish
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            variant="${{ inputs.variant }}"
            publish_latest="${{ inputs.publish_latest }}"
          else
            variant="dev"
            publish_latest="true"
          fi
          echo "variant=${variant}" >> "${GITHUB_OUTPUT}"
          echo "publish_latest=${publish_latest}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          tags="${IMAGE_NAME}:${{ steps.publish.outputs.variant }}"
          if [[ "${{ steps.publish.outputs.variant }}" == "dev" && "${{ steps.publish.outputs.publish_latest }}" == "true" ]]; then
            tags+=$'\n'"${IMAGE_NAME}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ steps.publish.outputs.variant }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OpenCode Plus server image for Docker and Unraid
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ steps.publish.outputs.variant }}
          cache-to: type=gha,mode=max,scope=${{ steps.publish.outputs.variant }}
