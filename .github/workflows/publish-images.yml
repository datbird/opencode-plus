name: Publish Images

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Docker target to build
        required: true
        default: dev
        type: choice
        options:
          - base
          - dev
          - full
      publish_latest:
        description: Also tag the selected image as latest
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/opencode-plus

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          tags="${IMAGE_NAME}:${{ inputs.variant }}"
          if [[ "${{ inputs.variant }}" == "dev" && "${{ inputs.publish_latest }}" == "true" ]]; then
            tags+=$'\n'"${IMAGE_NAME}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ inputs.variant }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ inputs.variant }}
          cache-to: type=gha,mode=max,scope=${{ inputs.variant }}
